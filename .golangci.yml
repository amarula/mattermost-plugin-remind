version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unconvert
    - unused
    - whitespace

  settings:
    govet:
      enable-all: true
    misspell:
      locale: US
    gocritic:
      disabled-checks:
        - ifElseChain
    revive:
      confidence: 0

  exclusions:
    rules:
      # Reminder and Occurrence are marshalled straight into the plugin's KV
      # store with no json tags, so their Go field names are the stored keys.
      # Renaming Id or TeamId would silently decode every reminder already
      # stored as zero values; it needs json tags and a migration for what is
      # there, which is its own change. storage_format_test.go pins the format.
      - path: server/(reminder|occurrence)\.go
        text: 'var-naming: (struct field|var) (Id|TeamId|ReminderId|botUserId) should be'
        linters:
          - revive
      - path: _test\.go
        linters:
          - bodyclose
      # Test fixtures are written to look like the objects the code is handed,
      # so they set fields the test itself never reads. That is the point of a
      # fixture, not a dead store.
      - path: _test\.go
        text: 'unusedwrite:'
        linters:
          - govet
      # The starter template's build tooling reads the bundle path and the
      # server URL it is given and logs them, which is what the gosec taint
      # rules flag. It is a development CLI, not part of the shipped plugin.
      - path: ^build/
        text: '^(G30[46]|G70[0-9]):'
        linters:
          - gosec
      # govet's fieldalignment wants struct fields ordered to shave pointer
      # bytes. The structs it names are read by people and, for Reminder and
      # Occurrence, are the stored format's field order; neither is worth
      # shuffling for a layout win in a plugin that holds a handful of them.
      - text: 'fieldalignment:'
        linters:
          - govet
      # indent-error-flow wants the else branch outdented when the if branch
      # returns. Where the branch is long - the payload parser - that is a large
      # reindent with no behaviour change, which belongs in a pass of its own
      # rather than in the middle of a lint gate.
      - text: 'indent-error-flow:'
        linters:
          - revive

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/scottleedavis/mattermost-plugin-remind
