name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The bundles are assembled by node: the Makefile reads the id, the version
      # and the platform list out of plugin.json with it, and
      # build/generate-manifest.js writes each bundle's manifest.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'

      - name: Test
        run: make test-server

      - name: Build bundles
        run: make dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes || true
          gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz --clobber
